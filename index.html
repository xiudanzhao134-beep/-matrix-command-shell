<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06131c">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src data:;">
<title>项目作战指挥台</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#040b11;color:#eaf7ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% -8%,#193e53 0,#081722 34%,#040b11 72%);padding-bottom:82px}
header{position:sticky;top:0;z-index:20;padding:11px 13px;background:#06131ded;backdrop-filter:blur(14px);border-bottom:1px solid #1b4256}
h1{font-size:18px;margin:0}.sub{font-size:9px;color:#89b0c2;margin-top:3px}.wrap{max-width:1200px;margin:auto;padding:9px}
.sec{background:#06141e;border:1px solid #193e52;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 0 22px #0006}.sec h2{font-size:14px;margin:0 0 9px}.sec h3{font-size:12px;margin:13px 0 7px}.muted{color:#82a9bc;font-size:10px;line-height:1.55}
.privacy{border:1px solid #286c4b;background:#082319;color:#baf5ce;border-radius:11px;padding:8px 10px;font-size:9px;line-height:1.6;margin-bottom:9px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{background:#071a25;border:1px solid #24516a;border-radius:10px;padding:8px 4px;text-align:center;color:#86aabb;font-size:8px}.stat b{display:block;color:#effcff;font-size:17px;margin-top:2px}
.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.module{border:1px solid #28566f;background:#071a26;border-radius:12px;padding:10px;cursor:pointer}.module b{font-size:12px}.module p{margin:6px 0 0;color:#8db3c5;font-size:9px;line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.kcard{border:1px solid #28566f;background:#071a25;border-radius:11px;padding:9px}.kcard b{font-size:11px}.kcard .num{font-size:19px;font-weight:900;margin:4px 0}.bar{height:6px;background:#102c3b;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#42d7ff,#7be7ad)}
.warn{border:1px solid #805334;background:#281609;border-radius:11px;padding:9px;color:#ffd7a3;font-size:10px;line-height:1.55}
.gold{border-color:#82702d!important;background:#211b08!important}.green{border-color:#286847!important;background:#082218!important}.orange{border-color:#7d512b!important;background:#271707!important}.red{border-color:#743746!important;background:#230c13!important}
.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid #163747;padding:8px 1px;cursor:pointer}.avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid #386e89;background:#0b2634;display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}.mini{margin-left:auto;text-align:right;color:#8caebe;font-size:8px}.mini b{display:block;color:#effcff;font-size:11px}
.badge{display:inline-block;border:1px solid #315d74;border-radius:999px;padding:2px 5px;font-size:7px;color:#9ec3d4;margin-top:3px}.badge.good{border-color:#407445;color:#a9edb8}.badge.hist{border-color:#7c6b2f;color:#ecd57a}
.search{width:100%;border:1px solid #2b566e;background:#071a25;color:white;border-radius:9px;padding:10px;margin-bottom:7px}
.controls{display:flex;gap:6px;overflow:auto;margin-bottom:7px}.chip{white-space:nowrap;border:1px solid #2a566f;background:#071b28;border-radius:999px;padding:6px 9px;font-size:9px;color:#b4d2df}.chip.on{color:#58ddff;border-color:#58c9ef}
.decision{border:1px solid #2a556d;border-radius:10px;padding:9px;margin:6px 0;background:#071a25;cursor:pointer}.decision b{font-size:11px}.decision p{margin:4px 0 0;color:#91b5c5;font-size:9px;line-height:1.5}
.drawer{position:fixed;inset:0 0 0 auto;width:min(470px,100vw);background:#06131dfb;z-index:60;transform:translateX(105%);transition:.23s;overflow:auto;padding:16px;border-left:1px solid #28536a}.drawer.show{transform:none}.close{position:sticky;top:0;float:right;border:1px solid #39728e;background:#082334;color:white;width:34px;height:34px;border-radius:50%;z-index:4}.hero{display:flex;gap:12px;align-items:center;padding-top:15px}.hero .avatar{width:72px;height:72px;border-radius:16px}.hero h2{margin:0;font-size:18px}
.intel{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.cell{border:1px solid #245169;background:#071a25;border-radius:9px;padding:8px}.cell small{display:block;color:#7fa3b5;font-size:8px}.cell b{font-size:14px}.signal{border:1px solid #2b596f;border-radius:11px;padding:9px;font-size:10px;line-height:1.55;margin:9px 0}
.works{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.work{border:1px solid #234b61;border-radius:8px;overflow:hidden;background:#0a1c27;min-height:138px}.work img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.work .fake{height:112px;padding:9px;background:linear-gradient(155deg,#16425a,#081823);display:flex;align-items:flex-end;font-size:9px;line-height:1.35}.work .cap{padding:6px;font-size:8px;line-height:1.35}.metrics{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.metrics span{font-size:7px;border:1px solid #2b5369;border-radius:999px;padding:2px 4px;color:#a4c5d3}
.timeline{display:grid;grid-template-columns:72px 1fr;gap:5px}.timeline b,.timeline div{padding:7px 8px;border-bottom:1px solid #173949;font-size:9px;line-height:1.5}
.alloc{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.alloc>div{border:1px solid #26526a;border-radius:10px;padding:8px}.alloc b{font-size:12px}.alloc ul{padding-left:15px;margin:5px 0;color:#91b6c6;font-size:9px}
.acqgroup{border:1px solid #28566f;border-radius:11px;padding:8px;margin:7px 0}.acqacc{display:flex;justify-content:space-between;gap:6px;border-top:1px solid #183a4b;padding:7px 0;font-size:9px}.acqacc:first-of-type{border-top:0}
.source-note{font-size:8px;color:#759bad;line-height:1.55;margin-top:8px}
button{border:1px solid #37728e;background:#082334;color:#eaffff;border-radius:9px;padding:9px 11px;font-weight:700;font-size:11px}.primary{border-color:#49d8ff;background:#0b3b53}
.empty{text-align:center;padding:50px 15px}.empty .icon{font-size:50px}.empty p{font-size:11px;color:#8fb3c3;line-height:1.7}
.nav{position:fixed;bottom:0;left:0;right:0;height:66px;background:#06131df4;backdrop-filter:blur(13px);border-top:1px solid #1c4254;display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;border:0;background:none;color:#7599aa;border-radius:0;padding:6px 1px;font-size:16px}.nav button.on{color:#61ddff}.nav span{display:block;font-size:8px;margin-top:1px}
@media(max-width:760px){.wrap{padding:8px}.modules{grid-template-columns:1fr}.works{grid-template-columns:repeat(3,1fr)}.alloc{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,1fr)}.drawer{width:100vw}}
</style>
<style>
.camp-map{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
.camp-card{
  position:relative;overflow:hidden;border:1px solid #2a5871;border-radius:14px;
  padding:10px;background:linear-gradient(180deg,#0a1e2a,#06141e);
  min-height:150px;box-shadow:inset 0 0 24px #0b2a3b55,0 0 18px #0005
}
.camp-card:before{content:"";position:absolute;inset:-40% auto auto -20%;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#57d8ff22,transparent 65%);pointer-events:none}
.camp-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.camp-title b{font-size:13px;letter-spacing:.5px}
.camp-title span{font-size:9px;border:1px solid #315e74;border-radius:999px;padding:3px 6px;color:#a7cad8}
.camp-sub{color:#84aebe;font-size:9px;line-height:1.45;margin-top:3px}
.camp-units{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.camp-unit{width:52px;text-align:center;position:relative;cursor:pointer}
.camp-unit .avatar{width:38px;height:38px;margin:auto}
.camp-unit small{display:block;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.camp-unit em{position:absolute;right:0;top:-4px;font-style:normal;font-size:7px;background:#07151f;border:1px solid #3d6c83;border-radius:999px;padding:2px 4px;color:#d7f4ff}
.camp-S{border-color:#ef5f5f;box-shadow:inset 0 0 25px #7b171744,0 0 20px #ff4e4e18}
.camp-A{border-color:#d9a93b;box-shadow:inset 0 0 25px #72581733,0 0 20px #ffc84b14}
.camp-B{border-color:#3d9ce0;box-shadow:inset 0 0 25px #15517c33,0 0 20px #55b9ff14}
.camp-C{border-color:#6889a6}
.camp-NEW{border-color:#8f6ad8}
.camp-RED{border-color:#a94b5e}
.war-order{border:1px solid #355e72;border-radius:11px;padding:9px;margin-top:9px;background:#071a25}
.war-order b{font-size:10px}.war-order p{margin:4px 0 0;color:#91b7c8;font-size:9px;line-height:1.5}
@media(max-width:760px){
  .camp-map{grid-template-columns:1fr 1fr;gap:7px}
  .camp-card{padding:9px;min-height:145px}
  .camp-unit{width:47px}.camp-unit .avatar{width:35px;height:35px}
}
</style>

</head><body>
<header><h1>项目作战指挥台</h1><div class="sub">私人数据本地导入 · 多模块统筹 · KPI驱动决策</div></header>
<div class="wrap"><div class="privacy">🔐 公开网页仅包含界面代码，不包含账号、模板、目标、经营数据或项目明细。私人数据包导入后只保存在当前浏览器本地。</div><main id="app"></main></div>
<input id="file" type="file" accept=".json,application/json" hidden>
<div class="drawer" id="drawer"><button class="close" onclick="closeDrawer()">✕</button><div id="drawerBody"></div></div>
<nav class="nav">
<button class="on" onclick="tab('overview',this)">🧭<span>总控</span></button>
<button onclick="tab('shooting',this)">🎬<span>拍摄</span></button>
<button onclick="tab('matrix',this)">♟️<span>矩阵</span></button>
<button onclick="tab('kpi',this)">🎯<span>KPI决策</span></button>
<button onclick="tab('acq',this)">🔗<span>获客</span></button>
</nav>
<script>
const KEY='matrix_private_pack_v5';let P=null,view='overview',filter='全部';
const fmt=n=>n===null||n===undefined||!Number.isFinite(Number(n))?'—':(Math.abs(Number(n))>=10000?(Number(n)/10000).toFixed(Number(n)>=100000?1:2).replace(/\.0+$/,'')+'万':Math.round(Number(n)).toLocaleString('zh-CN'));
const pct=v=>v===null||v===undefined||!Number.isFinite(Number(v))?'—':((Number(v)>=0?'+':'')+(Number(v)*100).toFixed(1)+'%');
const idx=v=>v===null||v===undefined||!Number.isFinite(Number(v))?'—':Number(v).toFixed(2)+'×';
function accts(){return P?Object.values(P.D.camps).flatMap(c=>c.accounts):[]}
function av(a){return `<div class="avatar">${a.avatarData?`<img src="${a.avatarData}">`:(a.grade||'?')}</div>`}
function load(){try{const x=localStorage.getItem(KEY);if(x)P=JSON.parse(x)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){alert('本地存储空间不足，请清理旧版本站点数据后再导入。')}}
function importPack(){document.getElementById('file').click()}
document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x.D||!x.kpi||!x.project)throw new Error('不是有效的私人数据包');P=x;save();render()}catch(err){alert('导入失败：'+err.message)}e.target.value=''});
function tab(v,b){view=v;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()}
function openId(id){const a=accts().find(x=>x.id===id);if(a)openAccount(a)}
function bar(p){return `<div class="bar"><i style="width:${Math.max(0,Math.min(100,(p||0)*100))}%"></i></div>`}
function render(){const app=document.getElementById('app');if(!P){app.innerHTML=`<section class="sec empty"><div class="icon">🛰️</div><h2>导入私人数据包</h2><p>导入后即可看到项目总控、账号矩阵、近7日公域结果、KPI进度与具体决策。</p><button class="primary" onclick="importPack()">导入私人数据包</button></section>`;return}({overview,shooting,matrix,kpi,acq}[view])(app)}
function overview(app){
 const o=P.meta.projectOverview,k=P.kpi,c=P.meta.publicCoverage||{};
 app.innerHTML=`<div class="stats"><div class="stat">周播放<b>${fmt(o.play)}</b></div><div class="stat">周涨粉<b>${fmt(o.netFollow)}</b></div><div class="stat">主力军S<b>${P.D.camps.S.accounts.length}</b></div><div class="stat">先锋营A<b>${P.D.camps.A.accounts.length}</b></div></div>
 <section class="sec"><h2>三大工作板块</h2><div class="modules">${P.project.modules.map(m=>`<div class="module" onclick="jump('${m.key}')"><b>${m.name}</b><p>${m.summary}</p></div>`).join('')}</div></section>
 <section class="sec"><h2>月度KPI总控</h2><div class="kpis">${k.items.slice(0,4).map(x=>`<div class="kcard"><b>${x.name} · 权重${x.weight}%</b><div class="num">${x.done==null?(x.status?'待确认':'—'):(x.unit==='条'?`${x.done}/${x.target}`:fmt(x.done))}</div>${x.progress==null?'':bar(x.progress)}<div class="muted">${x.progress==null?(x.status||''):`完成 ${(x.progress*100).toFixed(1)}% · 缺口 ${fmt(x.gap)}`}</div></div>`).join('')}</div><div class="warn" style="margin-top:8px">${k.pace.note}<br>当前曝光缺口 ${fmt(k.pace.remainingExposure)}；按尚未回收周期折算需 ${fmt(k.pace.needDaily)}/天。</div></section>
 <section class="sec"><h2>当前优先级</h2>${(P.project.todayActions||[]).map(x=>`<div class="decision"><b>${x}</b></div>`).join('')}</section>`;
}
function jump(k){view=k==='shooting'?'shooting':k==='matrix'?'matrix':'acq';const ni={shooting:1,matrix:2,acq:4}[view];document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('on',i===ni));render()}
function shooting(app){const s=P.shooting;app.innerHTML=`<section class="sec"><h2>拍摄作战室</h2><div class="stats"><div class="stat">上次拍摄<b>${s.lastShoot}</b></div><div class="stat">下次预估<b>${s.nextEstimate}</b></div><div class="stat">建议备拍<b>${s.nextScriptPack.total}</b></div><div class="stat">验证/新内容<b>${s.nextScriptPack.verified}/${s.nextScriptPack.new}</b></div></div><p class="muted">${s.lastPrep}<br>${s.coreRule}</p></section><section class="sec"><h2>下一期脚本结构</h2><div class="alloc">${s.nextScriptPack.categories.map(c=>`<div><b>${c.name} · ${c.count}条</b><ul>${c.examples.map(e=>`<li>${e}</li>`).join('')}</ul></div>`).join('')}</div></section><section class="sec"><h2>最近内容信号 → 下一拍怎么选</h2>${s.signals.map(x=>`<div class="decision gold"><b>${x.title}</b><p>${x.evidence}</p></div>`).join('')}</section><section class="sec"><h2>拍摄周期SOP</h2><div class="timeline">${s.cycle.map(x=>`<b>${x.when}</b><div>${x.task}</div>`).join('')}</div></section>`}
function matrix(app){
 const fs=['全部','主力放量','扩量验证','高体量修复','守盘','恢复观察','暂停优质素材','账号健康优先'];
 app.innerHTML=`<section class="sec"><h2>矩阵排兵布阵</h2>
 <div class="muted">“全部”按老板版战区看：S主力军 / A先锋营 / B试验营 / C观察营 / 新兵 / 异常池。选择其他标签时，再切换到具体运营动作分类。</div>
 <div class="controls" style="margin-top:8px">${fs.map(f=>`<button class="chip ${filter===f?'on':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}</div>
 <input id="q" class="search" placeholder="搜索账号 / 平台 / 模板" oninput="renderMatrixBody()">
 <div id="matrixBody"></div></section>`;
 renderMatrixBody()
}
function setFilter(f){filter=f;matrix(document.getElementById('app'))}
function renderMatrixBody(){
 const box=document.getElementById('matrixBody'); if(!box)return;
 const q=(document.getElementById('q').value||'').toLowerCase();
 if(filter==='全部'){
   const order=['S','A','B','C','NEW','RED'];
   box.innerHTML=`<div class="camp-map">${order.map(k=>{
     const c=P.D.camps[k];
     const xs=c.accounts.filter(a=>[a.name,a.platform,a.template,a.role].join(' ').toLowerCase().includes(q));
     return `<div class="camp-card camp-${k}">
       <div class="camp-title"><b style="color:${c.color||'#eaf7ff'}">${c.name}</b><span>${xs.length}个</span></div>
       <div class="camp-sub">${c.subtitle||''}</div>
       <div class="camp-units">${xs.slice(0,12).map(a=>`<div class="camp-unit" onclick='openId(${JSON.stringify(a.id)})'>${av(a)}<em>${fmt(a.play)}</em><small>${a.name}</small></div>`).join('')}</div>
       ${xs.length>12?`<div class="muted" style="margin-top:7px">还有 ${xs.length-12} 个账号，点搜索可快速定位</div>`:''}
       <div class="war-order"><b>作战口令</b><p>${c.command||c.subtitle||''}</p></div>
     </div>`
   }).join('')}</div>`;
   return;
 }
 let xs=accts().filter(a=>a.decisionAction===filter);
 xs=xs.filter(a=>[a.name,a.platform,a.template,a.role].join(' ').toLowerCase().includes(q));
 box.innerHTML=xs.map(a=>`<div class="row" onclick='openId(${JSON.stringify(a.id)})'>${av(a)}<div><b>${a.name}</b><div class="muted">${a.platform} · ${a.template||'—'}<br>${a.decisionAction}</div></div><div class="mini"><b>${fmt(a.play)}</b>${pct(a.wow)} · ${idx(a.performanceIndex)}</div></div>`).join('') || `<div class="muted" style="padding:14px 0">当前筛选暂无账号</div>`;
}
function kpi(app){const k=P.kpi,d=P.decision;app.innerHTML=`<section class="sec"><h2>KPI缺口与速度</h2><div class="kpis">${k.items.map(x=>`<div class="kcard"><b>${x.name} · ${x.weight}%</b><div class="num">${x.done==null?'待确认':(x.unit==='条'?`${x.done}/${x.target}`:fmt(x.done))}</div>${x.progress==null?'':bar(x.progress)}<div class="muted">${x.progress==null?(x.status||''):`完成 ${(x.progress*100).toFixed(1)}% · 缺口 ${fmt(x.gap)}`}</div></div>`).join('')}</div></section><section class="sec"><h2>增量预算怎么分</h2>${d.exposureBudget.allocation.map(x=>`<div class="decision"><b>${x.bucket} · ${(x.share*100).toFixed(0)}% ≈ ${fmt(x.increment)}/周</b><p>${x.rule}</p></div>`).join('')}</section><section class="sec"><h2>四支战队</h2>${d.squads.map(s=>`<div class="decision ${s.color}"><b>${s.name}｜${s.goal}</b><p>${s.action}</p><div class="muted">${s.accounts.map(a=>`${a.name}(${fmt(a.play)})`).join(' · ')}</div></div>`).join('')}</section><section class="sec"><h2>爆款攻坚</h2>${d.viralPlan.map(x=>`<div class="decision"><b>${x}</b></div>`).join('')}</section><section class="sec"><h2>我采用的运营判断框架</h2>${(d.methodNotes||[]).map((x,i)=>`<div class="decision"><b>${i+1}. ${x}</b></div>`).join('')}</section><section class="sec"><h2>内部判断规则</h2>${d.operatorRules.map((x,i)=>`<div class="decision"><b>${i+1}. ${x}</b></div>`).join('')}</section>`}
function acq(app){const a=P.acquisition;app.innerHTML=`<section class="sec"><h2>获客总控</h2><div class="stats"><div class="stat">目标<b>${a.targetA}</b></div><div class="stat">核心账号<b>${a.accountCount}</b></div><div class="stat">渠道A<b>${a.channels.douyin.channel}</b></div><div class="stat">渠道B<b>${a.channels.video.channel}</b></div></div><div class="warn" style="margin-top:8px">${a.status}</div></section><section class="sec"><h2>最新获客账号</h2>${a.groups.map(g=>`<div class="acqgroup"><b>${g.name}</b>${g.accounts.map(x=>`<div class="acqacc"><span>${x.platform} · ${x.name}</span><span>${x.template||''}</span></div>`).join('')}</div>`).join('')}</section><section class="sec"><h2>链路巡检SOP</h2>${a.workflow.map((x,i)=>`<div class="decision"><b>${i+1}. ${x}</b></div>`).join('')}</section>`}
function worksHtml(a){
 const p=a.publicSearchV4||{},w=p.recentWorks||[],hist=p.historicalEvidence||[];
 if(!w.length && !hist.length) return '';
 let body='';
 if(w.length){
   body=`<div class="works">${w.map(x=>`<div class="work">
