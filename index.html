<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06131c">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src data:;">
<title>矩阵作战指挥台</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#040b11;color:#eaf7ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% -10%,#16384b 0,#081722 35%,#040b11 72%);padding-bottom:86px}
header{position:sticky;top:0;z-index:20;padding:12px 14px;background:#06131de9;backdrop-filter:blur(14px);border-bottom:1px solid #173c50}
h1{font-size:19px;margin:0;letter-spacing:1px}.sub{font-size:10px;color:#8eb7c9;margin-top:4px}
.wrap{max-width:1180px;margin:auto;padding:10px}
.privacy{border:1px solid #276849;background:#082218;border-radius:12px;padding:9px 11px;color:#baf5ce;font-size:10px;line-height:1.6;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.stat{background:#081822;border:1px solid #1f4b62;border-radius:10px;padding:9px 3px;text-align:center;color:#8eb6c9;font-size:9px}.stat b{display:block;color:#e9fbff;font-size:18px;margin-top:2px}
.panel{background:#06141e;border:1px solid #193d50;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 0 24px #0006}.panel h2{font-size:14px;margin:0 0 9px}.panel h3{font-size:12px;margin:12px 0 7px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.camp{background:linear-gradient(180deg,#0a1d29,#06131c);border:1px solid #2b5c75;border-radius:13px;padding:10px;min-height:130px;cursor:pointer}.camp h3{font-size:12px;margin:0 0 5px}.muted{color:#82a9bc;font-size:10px;line-height:1.5}
.units{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.unit{width:56px;text-align:center;cursor:pointer;position:relative}.unit small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:8px;margin-top:4px}
.avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;margin:auto;border:2px solid #3f7189;background:#0b2533;box-shadow:0 0 12px #35cff044;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px}.avatar img{width:100%;height:100%;object-fit:cover}.avatar.big{width:76px;height:76px;border-radius:16px;margin:0}.avatar.rowav{width:38px;height:38px;margin:0}
.gold .avatar{border-color:#ffd35e;box-shadow:0 0 16px #ffcd4b77}.red .avatar{border-color:#ff596f;box-shadow:0 0 14px #ff496066}.orange .avatar{border-color:#ff9d4d}.green .avatar{border-color:#56df8b}.gray{opacity:.78}
.rankpill{position:absolute;right:3px;top:-3px;background:#07141d;border:1px solid #35617a;border-radius:999px;padding:2px 4px;font-size:7px}
.radars{display:grid;grid-template-columns:1fr 1fr;gap:9px}.decision{border:1px solid #31566c;border-radius:10px;padding:9px;background:#071721;margin:6px 0;cursor:pointer}.decision.win{border-color:#7d6928;background:#211b07}.decision.risk{border-color:#743937;background:#220e0d}.decision.new{border-color:#4d6f8e;background:#071d2d}.decision b{font-size:11px}.decision small{display:block;color:#91b6c7;font-size:9px;margin-top:3px;line-height:1.45}
.alert{border:1px solid #76413d;background:#21100e;border-radius:11px;padding:10px;font-size:10px;line-height:1.6;margin-bottom:10px}.alert b{color:#ff9388}
button{border:1px solid #37728e;background:#082334;color:#eaffff;border-radius:10px;padding:10px 12px;font-weight:700;font-size:12px}.primary{border-color:#4cd7ff;background:#0b3c55;box-shadow:0 0 18px #27cfff33}.danger{border-color:#7b3341;color:#ffb6c0}
.empty{padding:52px 16px;text-align:center}.empty .icon{font-size:52px}.empty h2{font-size:19px}.empty p{color:#8fb2c3;font-size:12px;line-height:1.7}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}
.search{width:100%;border:1px solid #2a5369;background:#071a25;color:#eefaff;border-radius:10px;padding:11px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:9px;border-bottom:1px solid #153343;padding:9px 2px;cursor:pointer}.row .mini{margin-left:auto;text-align:right;font-size:9px;color:#86aabc}.row .mini b{display:block;color:#eefcff;font-size:12px}
.drawer{position:fixed;inset:0 0 0 auto;width:min(460px,100vw);background:#06131df9;z-index:60;transform:translateX(105%);transition:.25s;overflow:auto;padding:17px;border-left:1px solid #244d63}.drawer.show{transform:none}.close{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;padding:0;z-index:3}
.hero{display:flex;align-items:center;gap:12px;padding-top:16px}.hero h2{margin:0 0 4px;font-size:18px}
.signal{border:1px solid #31576b;border-radius:12px;padding:11px;margin:12px 0;line-height:1.6;font-size:11px}.signal.gold{border-color:#806c26;background:#211b07}.signal.red{border-color:#74343d;background:#220c12}.signal.orange{border-color:#825021;background:#261606}.signal.green{border-color:#286443;background:#082116}
.intel{display:grid;grid-template-columns:1fr 1fr;gap:7px}.cell{border:1px solid #245068;background:#071a25;border-radius:9px;padding:9px}.cell small{display:block;color:#7fa5b7;font-size:9px}.cell b{font-size:15px}
.detail{margin-top:10px;border-top:1px solid #1a3d4f;padding-top:8px}.detail div{padding:5px 0;font-size:11px}
.spark{height:64px;display:flex;align-items:flex-end;gap:5px;margin-top:8px}.spark i{flex:1;background:linear-gradient(#52d7ff,#1d6088);min-height:3px;border-radius:3px 3px 0 0}
.sourcebox{border:1px solid #264c61;border-radius:11px;background:#071925;padding:10px;margin-top:10px}.sourcebox h3{margin:0 0 6px}.sourcebox p{font-size:10px;color:#9bc0d1;line-height:1.55;margin:5px 0}.sourceitem{border-top:1px solid #173848;padding:8px 0;font-size:10px}.sourceitem:first-of-type{border-top:0}.sourceitem a{color:#65ddff;text-decoration:none}.sourceitem b{display:block;margin-bottom:3px}.work{border-bottom:1px solid #173747;padding:9px 0}.work:last-child{border-bottom:0}.work b{font-size:11px;line-height:1.45;display:block}.metrics{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.metrics span{border:1px solid #28536a;border-radius:999px;padding:3px 6px;font-size:8px;color:#9ec3d4}
.nav{position:fixed;bottom:0;left:0;right:0;height:66px;background:#06131df4;backdrop-filter:blur(13px);border-top:1px solid #1c4254;display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;border:0;background:none;color:#7699aa;border-radius:0;padding:7px 3px}.nav button.on{color:#62ddff}.nav span{display:block;font-size:9px;margin-top:2px}
@media(max-width:760px){.wrap{padding:9px}.grid{grid-template-columns:1fr 1fr}.radars{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,1fr)}.camp{min-height:124px;padding:9px}.unit{width:48px}.avatar{width:36px;height:36px}.drawer{width:100vw}.privacy{font-size:10px}}
</style>
</head>
<body>
<header><h1>矩阵作战指挥台</h1><div class="sub">网页空壳 · 私人数据只保存在当前浏览器</div></header>
<div class="wrap"><div class="privacy">🔐 网页代码不包含公司账号或经营数据。模板图、账号名、内部数据和公域检索结果都来自你手动导入的私人数据包；页面不会后台上传数据。</div><main id="app"></main></div>
<input id="file" type="file" accept=".json,application/json" hidden>
<div class="drawer" id="drawer"><button class="close" onclick="closeDrawer()">✕</button><div id="drawerBody"></div></div>
<nav class="nav">
<button class="on" onclick="tab('battle',this)">⚔️<span>战场</span></button>
<button onclick="tab('accounts',this)">👥<span>账号</span></button>
<button onclick="tab('decision',this)">🎯<span>决策</span></button>
<button onclick="tab('data',this)">🔐<span>数据</span></button>
</nav>
<script>
const KEY='matrix_private_pack_v3';let PACK=null,currentTab='battle';
const fmt=n=>n===null||n===undefined||!Number.isFinite(Number(n))?'—':(Math.abs(Number(n))>=10000?(Number(n)/10000).toFixed(Number(n)>=100000?1:2).replace(/\.0+$/,'')+'万':Math.round(Number(n)).toLocaleString('zh-CN'));
const idx=v=>v===null||v===undefined||!Number.isFinite(Number(v))?'—':Number(v).toFixed(2)+'×';
const pct=v=>v===null||v===undefined||!Number.isFinite(Number(v))?'—':((Number(v)>=0?'+':'')+(Number(v)*100).toFixed(1)+'%');
const cls=a=>a.dataSignalColor||'gray';
function accounts(){return PACK?Object.values(PACK.D.camps).flatMap(c=>c.accounts):[]}
function av(a,c=''){return `<div class="avatar ${c}">${a.avatarData?`<img src="${a.avatarData}" alt="">`:(a.grade||'?')}</div>`}
function load(){try{const x=localStorage.getItem(KEY);if(x)PACK=JSON.parse(x)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(PACK))}catch(e){alert('本地保存失败，可能是浏览器存储空间不足。')}}
function importPack(){document.getElementById('file').click()}
document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(!p.D||!p.meta)throw new Error('不是有效数据包');PACK=p;save();render()}catch(err){alert('导入失败：'+err.message)}e.target.value=''});
function clearData(){if(confirm('清除这台设备浏览器中的私人矩阵数据？')){localStorage.removeItem(KEY);PACK=null;render()}}
function exportData(){if(!PACK)return;const b=new Blob([JSON.stringify(PACK)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='矩阵私人数据备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}
function statsCards(){const o=PACK.meta.projectOverview||{};return [['聚焦账号',accounts().length],['周播放',fmt(o.play)],['周涨粉',fmt(o.netFollow)],['异常',PACK.meta.risk?.length||0]].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('')}
function openById(id){const a=accounts().find(x=>x.id===id);if(a)openAccount(a)}
function decisionItem(x,type){return `<div class="decision ${type}" onclick='openById(${JSON.stringify(x.id)})'><b>${type==='risk'?'⚠️':type==='new'?'✨':'🔥'} ${x.name} · ${x.platform}</b><small>${fmt(x.play)}播放 · ${x.ratio!=null?'对基准 '+idx(x.ratio):''} ${x.wow!=null?'· 环比 '+pct(x.wow):''}</small></div>`}
function render(){const app=document.getElementById('app');if(!PACK){app.innerHTML=`<section class="panel empty"><div class="icon">🛰️</div><h2>导入私人矩阵数据</h2><p>第一次在这台设备打开时，选择私人 JSON 数据包。导入后会保存在当前浏览器。</p><div class="actions"><button class="primary" onclick="importPack()">导入私人数据包</button></div></section>`;return}({battle:renderBattle,accounts:renderAccounts,decision:renderDecision,data:renderData}[currentTab])(app)}
function renderBattle(app){
 const o=PACK.meta.projectOverview||{},warn=o.playWoW<0?`<div class="alert"><b>大盘提醒：</b>${o.period||''} 子葳整体播放 ${fmt(o.play)}，较上周 ${pct(o.playWoW)}；净增粉丝 ${fmt(o.netFollow)}，较上周 ${pct(o.netFollowWoW)}。先看哪些账号拖累、哪些账号仍在起量。</div>`:'';
 const camps=Object.entries(PACK.D.camps).map(([k,c])=>`<div class="camp" onclick="openCamp('${k}')"><h3 style="color:${c.color||'#65dfff'}">${c.name} · ${c.accounts.length}</h3><div class="muted">${c.subtitle||''}</div><div class="units">${c.accounts.slice(0,9).map(a=>`<div class="unit ${cls(a)}" onclick='event.stopPropagation();openById(${JSON.stringify(a.id)})'>${av(a)}<span class="rankpill">${fmt(a.play)}</span><small>${a.name}</small></div>`).join('')}</div></div>`).join('');
 app.innerHTML=`<div class="stats">${statsCards()}</div>${warn}<section class="panel"><h2>矩阵战场</h2><div class="grid">${camps}</div></section><section class="panel"><h2>快速决策雷达</h2><div class="radars"><div><div class="muted">成熟号起量</div>${(PACK.meta.topMovers||[]).slice(0,4).map(x=>decisionItem(x,'win')).join('')}</div><div><div class="muted">风险/下滑</div>${(PACK.meta.risk||[]).slice(0,4).map(x=>decisionItem(x,'risk')).join('')}</div></div>${(PACK.meta.newRisers||[]).length?`<h3>新号起量</h3>${PACK.meta.newRisers.slice(0,4).map(x=>decisionItem(x,'new')).join('')}`:''}</section>`;
}
function renderAccounts(app){app.innerHTML=`<section class="panel"><h2>全矩阵账号</h2><input class="search" id="q" placeholder="搜索账号 / 平台 / 角色 / 模板" oninput="filterAccounts()"><div id="rows"></div></section>`;filterAccounts()}
function filterAccounts(){const el=document.getElementById('rows');if(!el)return;const q=(document.getElementById('q').value||'').toLowerCase();el.innerHTML=accounts().filter(a=>[a.name,a.platform,a.role,a.grade,a.template].join(' ').toLowerCase().includes(q)).map(a=>`<div class="row ${cls(a)}" onclick='openById(${JSON.stringify(a.id)})'>${av(a,'rowav')}<div><b>${a.name}</b><div class="muted">${a.platform} · ${a.role}<br>${a.dataSignal||''}</div></div><div class="mini"><b>${fmt(a.play)}</b>${idx(a.performanceIndex)}</div></div>`).join('')}
function renderDecision(app){const o=PACK.meta.projectOverview||{};app.innerHTML=`<section class="panel"><h2>矩阵决策雷达</h2><div class="alert"><b>当前大盘：</b>${o.period||''} 播放 ${fmt(o.play)}（环比 ${pct(o.playWoW)}），涨粉 ${fmt(o.netFollow)}（环比 ${pct(o.netFollowWoW)}）。</div><h3>🔥 成熟号起量</h3>${(PACK.meta.topMovers||[]).map(x=>decisionItem(x,'win')).join('')||'<div class="muted">暂无</div>'}<h3>✨ 新号起量</h3>${(PACK.meta.newRisers||[]).map(x=>decisionItem(x,'new')).join('')||'<div class="muted">暂无</div>'}<h3>⚠️ 风险/下滑</h3>${(PACK.meta.risk||[]).map(x=>decisionItem(x,'risk')).join('')||'<div class="muted">暂无</div>'}</section>`}
function renderData(app){const o=PACK.meta.projectOverview||{};app.innerHTML=`<section class="panel"><h2>私人数据管理</h2><div class="detail"><div>内部数据周期：<b>${PACK.meta.sourcePeriod||'—'}</b></div><div>聚焦账号：<b>${accounts().length}</b></div><div>匹配内部数据：<b>${PACK.meta.matchedRecords||0}</b></div><div>有播放数据：<b>${PACK.meta.withPlay||0}</b></div><div>公域已检索：<b>${PACK.meta.publicSearchChecked||0}</b></div><div>可靠公开索引命中：<b>${PACK.meta.publicReliableHits||0}</b></div><div>子葳大盘播放：<b>${fmt(o.play)}</b></div><div>子葳大盘涨粉：<b>${fmt(o.netFollow)}</b></div></div><div class="actions"><button class="primary" onclick="importPack()">导入新版数据包</button><button onclick="exportData()">导出备份</button><button class="danger" onclick="clearData()">清除本机数据</button></div><p class="muted" style="margin-top:14px">公域检索命中少，不代表账号不存在；很多视频号/抖音/快手页面不会稳定被通用搜索引擎索引。系统只保留可稳定归属的公开命中，避免误绑同名账号。</p></section>`}
function tab(name,btn){currentTab=name;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');render()}
function openCamp(k){const c=PACK.D.camps[k];document.getElementById('drawerBody').innerHTML=`<h2>${c.name}</h2><p class="muted">${c.command||c.subtitle||''}</p>${c.accounts.map(a=>`<div class="row ${cls(a)}" onclick='openById(${JSON.stringify(a.id)})'>${av(a,'rowav')}<div><b>${a.name}</b><div class="muted">${a.platform} · ${a.dataSignal||'暂无数据'}</div></div><div class="mini"><b>${fmt(a.play)}</b>${idx(a.performanceIndex)}</div></div>`).join('')}`;document.getElementById('drawer').classList.add('show')}
function spark(a){const vals=(a.historyWeeks||[]).map(x=>Number(x.play)||0),mx=Math.max(...vals,1);return `<div class="spark">${vals.map(v=>`<i style="height:${v?Math.max(4,Math.round(v/mx*60)):3}px" title="${fmt(v)}"></i>`).join('')}</div>`}
function publicBox(a){const p=a.publicSearch||{},items=p.items||[];return `<div class="sourcebox"><h3>🌐 公域观察</h3><p><b>${p.status||'未检索'}</b></p><p>${p.summary||''}</p>${items.map(i=>`<div class="sourceitem"><b>${i.title||''}</b><div>${i.date||''} ${i.metric?'· '+i.metric:''}</div>${i.url?`<a href="${i.url}" target="_blank" rel="noopener">打开公开来源 ↗</a>`:''}<div class="muted">${i.source||''}</div></div>`).join('')}<div class="actions" style="justify-content:flex-start"><button onclick='publicSearch(${JSON.stringify(a.publicSearchQuery||a.name)})'>手动打开公域搜索</button></div></div>`}
function publicSearch(q){window.open('https://www.bing.com/search?q='+encodeURIComponent(q),'_blank')}
function worksBox(a){const w=a.recentWorks||[];if(!w.length)return `<div class="sourcebox"><h3>📺 最近作品</h3><p>目前没有可可靠接入的作品级数据。该账号仍可查看最新周聚合数据和公域检索结果。</p></div>`;return `<div class="sourcebox"><h3>📺 最近作品 · ${a.worksAsOf||''}</h3><p>来源：${a.worksSource||''}</p>${w.slice(0,12).map(x=>`<div class="work"><b>${x.title||''}</b><div class="muted">${x.publishedAt||''} · ${x.visibility||''}</div><div class="metrics"><span>播 ${fmt(x.play)}</span><span>赞 ${fmt(x.likes)}</span><span>评 ${fmt(x.comments)}</span><span>转 ${fmt(x.shares)}</span><span>藏 ${fmt(x.favorites)}</span><span>涨粉 ${fmt(x.followGain)}</span>${x.fiveSec!=null?`<span>5s ${(x.fiveSec*100).toFixed(1)}%</span>`:''}</div></div>`).join('')}</div>`}
function openAccount(a){const rank=a.dataRank?`#${a.dataRank}`:'—';document.getElementById('drawerBody').innerHTML=`<div class="hero">${av(a,'big')}<div><h2>${a.name}</h2><div class="muted">${a.platform} · 战略${a.grade}级<br>模板：${a.template||'—'}</div></div></div><div class="signal ${cls(a)}"><b>${a.dataSignal||'暂无数据'}</b><br>${a.decision||''}</div><div class="intel"><div class="cell"><small>最新周播放</small><b>${fmt(a.play)}</b></div><div class="cell"><small>净增粉丝</small><b>${fmt(a.netFollow)}</b></div><div class="cell"><small>粉丝数</small><b>${fmt(a.followers)}</b></div><div class="cell"><small>点赞 / 评论</small><b>${fmt(a.likes)} / ${fmt(a.comments)}</b></div><div class="cell"><small>4周基准</small><b>${fmt(a.baseline4w)}</b></div><div class="cell"><small>对自身基准</small><b>${idx(a.performanceIndex)}</b></div><div class="cell"><small>周环比</small><b>${pct(a.wow)}</b></div><div class="cell"><small>当前排名</small><b>${rank}</b></div></div><div class="muted" style="margin-top:12px">近周播放趋势</div>${spark(a)}<div class="detail"><div>账号定位：<b>${a.position||'—'}</b></div><div>战术角色：<b>${a.role||'—'}</b></div><div>当前模板：<b>${a.template||'—'}</b></div><div>内部更新频率：<b>${a.statsFreq||a.currentFreq||'—'}</b></div><div>账号状态：<b>${a.currentStatus||a.statsRemark||'正常'}</b></div><div>负责人：<b>${a.currentOwner||a.owner||'—'}</b></div>${a.statsAlias?`<div>数据表名称匹配：<b>${a.statsAlias}</b></div>`:''}<div>内部数据周期：<b>${a.dataPeriod||'—'}</b></div></div>${worksBox(a)}${publicBox(a)}`;document.getElementById('drawer').classList.add('show')}
function closeDrawer(){document.getElementById('drawer').classList.remove('show')}
load();render();
</script>
</body></html>
