<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06131c">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src data:;">
<title>矩阵作战指挥台</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#040b11;color:#eaf7ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;background:
radial-gradient(circle at 50% -10%,#15384c 0,#081722 34%,#040b11 72%);
padding-bottom:84px}
header{position:sticky;top:0;z-index:20;padding:12px 14px;background:#06131de8;backdrop-filter:blur(14px);border-bottom:1px solid #173c50}
h1{font-size:19px;margin:0;letter-spacing:1px}.sub{font-size:10px;color:#8eb7c9;margin-top:4px}
.wrap{max-width:1180px;margin:auto;padding:12px}
.privacy{border:1px solid #276849;background:#082218;border-radius:12px;padding:10px 12px;color:#baf5ce;font-size:11px;line-height:1.65;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.stat{background:#081822;border:1px solid #1f4b62;border-radius:10px;padding:10px;text-align:center;color:#8eb6c9;font-size:9px}.stat b{display:block;color:#e9fbff;font-size:20px;margin-top:2px}
.panel{background:#06141e;border:1px solid #193d50;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 0 24px #0006}.panel h2{font-size:14px;margin:0 0 9px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.camp{background:linear-gradient(180deg,#0a1d29,#06131c);border:1px solid #2b5c75;border-radius:13px;padding:10px;min-height:120px;cursor:pointer}.camp h3{font-size:12px;margin:0 0 5px}.muted{color:#82a9bc;font-size:10px;line-height:1.5}
.units{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.unit{width:54px;text-align:center;cursor:pointer}.orb{width:38px;height:38px;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;border:2px solid #3f7189;background:#0b2533;box-shadow:0 0 12px #35cff044}.unit small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:8px;margin-top:4px}.gold .orb{border-color:#ffd35e;box-shadow:0 0 14px #ffcd4b66}.red .orb{border-color:#ff596f;box-shadow:0 0 14px #ff496055}.orange .orb{border-color:#ff9d4d}.green .orb{border-color:#56df8b}.gray{opacity:.8}
.radars{display:grid;grid-template-columns:1fr 1fr;gap:9px}.decision{border:1px solid #31566c;border-radius:10px;padding:9px;background:#071721;margin:6px 0}.decision.win{border-color:#7d6928;background:#211b07}.decision.risk{border-color:#743937;background:#220e0d}.decision b{font-size:11px}.decision small{display:block;color:#91b6c7;font-size:9px;margin-top:3px}
button,.btn{border:1px solid #37728e;background:#082334;color:#eaffff;border-radius:10px;padding:10px 12px;font-weight:700;font-size:12px}.primary{border-color:#4cd7ff;background:#0b3c55;box-shadow:0 0 18px #27cfff33}.danger{border-color:#7b3341;color:#ffb6c0}
.empty{padding:52px 16px;text-align:center}.empty .icon{font-size:52px}.empty h2{font-size:19px}.empty p{color:#8fb2c3;font-size:12px;line-height:1.7}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}
.search{width:100%;border:1px solid #2a5369;background:#071a25;color:#eefaff;border-radius:10px;padding:11px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:9px;border-bottom:1px solid #153343;padding:9px 2px;cursor:pointer}.row .mini{margin-left:auto;text-align:right;font-size:9px;color:#86aabc}.row .mini b{display:block;color:#eefcff;font-size:12px}
.drawer{position:fixed;inset:0 0 0 auto;width:min(430px,100vw);background:#06131df8;z-index:60;transform:translateX(105%);transition:.25s;overflow:auto;padding:18px;border-left:1px solid #244d63}.drawer.show{transform:none}.close{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;padding:0}.signal{border:1px solid #31576b;border-radius:12px;padding:11px;margin:12px 0;line-height:1.6;font-size:11px}.signal.gold{border-color:#806c26;background:#211b07}.signal.red{border-color:#74343d;background:#220c12}.signal.orange{border-color:#825021;background:#261606}.signal.green{border-color:#286443;background:#082116}
.intel{display:grid;grid-template-columns:1fr 1fr;gap:7px}.cell{border:1px solid #245068;background:#071a25;border-radius:9px;padding:9px}.cell small{display:block;color:#7fa5b7;font-size:9px}.cell b{font-size:15px}
.detail{margin-top:10px;border-top:1px solid #1a3d4f;padding-top:8px}.detail div{padding:5px 0;font-size:11px}
.spark{height:64px;display:flex;align-items:flex-end;gap:5px;margin-top:8px}.spark i{flex:1;background:linear-gradient(#52d7ff,#1d6088);min-height:3px;border-radius:3px 3px 0 0}
.nav{position:fixed;bottom:0;left:0;right:0;height:66px;background:#06131df4;backdrop-filter:blur(13px);border-top:1px solid #1c4254;display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;border:0;background:none;color:#7699aa;border-radius:0;padding:7px 3px}.nav button.on{color:#62ddff}.nav span{display:block;font-size:9px;margin-top:2px}
.tab{display:none}.tab.on{display:block}
@media(max-width:760px){.wrap{padding:9px}.grid{grid-template-columns:1fr 1fr}.radars{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,1fr)}.stat{padding:8px 3px}.stat b{font-size:17px}.camp{min-height:112px;padding:9px}.unit{width:47px}.orb{width:34px;height:34px}.drawer{width:100vw}.privacy{font-size:10px}}
</style>
</head>
<body>
<header><h1>矩阵作战指挥台</h1><div class="sub">公共空壳 · 私人数据只保存在你的浏览器</div></header>
<div class="wrap">
  <div class="privacy">🔐 此网页代码不包含任何公司账号或经营数据。导入的私人数据包只保存在当前浏览器的本地存储中；网页已禁止网络数据请求。</div>
  <main id="app"></main>
</div>
<input id="file" type="file" accept=".json,application/json" hidden>
<div class="drawer" id="drawer"><button class="close" onclick="closeDrawer()">✕</button><div id="drawerBody"></div></div>
<nav class="nav">
<button class="on" onclick="tab('battle',this)">⚔️<span>战场</span></button>
<button onclick="tab('accounts',this)">👥<span>账号</span></button>
<button onclick="tab('decision',this)">🎯<span>决策</span></button>
<button onclick="tab('data',this)">🔐<span>数据</span></button>
</nav>
<script>
const KEY='matrix_private_pack_v1';
let PACK=null,currentTab='battle';
const $=s=>document.querySelector(s);
function fmt(n){if(n===null||n===undefined||!Number.isFinite(Number(n)))return '—';n=Number(n);if(Math.abs(n)>=10000)return (n/10000).toFixed(n>=100000?1:2).replace(/\.0+$/,'')+'万';return Math.round(n).toLocaleString('zh-CN')}
function idx(v){return v===null||v===undefined||!Number.isFinite(Number(v))?'—':Number(v).toFixed(2)+'×'}
function pct(v){return v===null||v===undefined||!Number.isFinite(Number(v))?'—':((Number(v)>=0?'+':'')+(Number(v)*100).toFixed(1)+'%')}
function accounts(){if(!PACK)return[];return Object.values(PACK.D.camps).flatMap(c=>c.accounts)}
function cls(a){return a.dataSignalColor||'gray'}
function save(){localStorage.setItem(KEY,JSON.stringify(PACK))}
function load(){try{const x=localStorage.getItem(KEY);if(x)PACK=JSON.parse(x)}catch(e){}}
function importPack(){document.getElementById('file').click()}
document.getElementById('file').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const p=JSON.parse(await f.text());
  if(!p.D||!p.meta)throw new Error('不是有效的数据包');
  PACK=p;save();render();
 }catch(err){alert('导入失败：'+err.message)}
 e.target.value='';
});
function clearData(){if(confirm('清除这台手机浏览器里的私人数据？')){localStorage.removeItem(KEY);PACK=null;render()}}
function exportData(){if(!PACK)return;const b=new Blob([JSON.stringify(PACK,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='矩阵私人数据备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}
function stats(){const a=accounts();return [
 ['账号',a.length],['已匹配',PACK.meta.matchedRecords||0],['有播放',PACK.meta.withPlay||0],['异常',(PACK.meta.signalCounts||{})['账号状态异常']||0]
]}
function topList(){return (PACK.meta.topMovers||[]).slice(0,5)}
function riskList(){return (PACK.meta.risk||[]).slice(0,5)}
function render(){
 const app=document.getElementById('app');
 if(!PACK){app.innerHTML=`<section class="panel empty"><div class="icon">🛰️</div><h2>导入你的私人矩阵数据</h2><p>这个网页本身是空的。第一次在手机上打开后，选择你的私人 JSON 数据包，之后会保存在这台手机的浏览器里。</p><div class="actions"><button class="primary" onclick="importPack()">导入私人数据包</button></div></section>`;return}
 if(currentTab==='battle')renderBattle(app);
 if(currentTab==='accounts')renderAccounts(app);
 if(currentTab==='decision')renderDecision(app);
 if(currentTab==='data')renderData(app);
}
function renderBattle(app){
 const st=stats().map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('');
 const camps=Object.entries(PACK.D.camps).map(([k,c])=>`<div class="camp" onclick="openCamp('${k}')"><h3 style="color:${c.color||'#65dfff'}">${c.name} · ${c.accounts.length}</h3><div class="muted">${c.subtitle||''}</div><div class="units">${c.accounts.slice(0,8).map(a=>`<div class="unit ${cls(a)}" onclick='event.stopPropagation();openAccountById(${JSON.stringify(a.id)})'><div class="orb">${a.grade||k}</div><small>${a.name}</small></div>`).join('')}</div></div>`).join('');
 app.innerHTML=`<div class="stats">${st}</div><section class="panel"><h2>矩阵战场</h2><div class="grid">${camps}</div></section><section class="panel"><h2>快速雷达</h2><div class="radars"><div><div class="muted">历史强势</div>${topList().slice(0,3).map(x=>`<div class="decision win"><b>🔥 ${x.name}</b><small>${fmt(x.play)} · ${idx(x.ratio)}</small></div>`).join('')}</div><div><div class="muted">历史观察</div>${riskList().slice(0,3).map(x=>`<div class="decision risk"><b>⚠️ ${x.name}</b><small>${fmt(x.play)} · ${idx(x.ratio)}</small></div>`).join('')}</div></div></section>`;
}
function renderAccounts(app){
 app.innerHTML=`<section class="panel"><h2>全矩阵账号</h2><input class="search" id="q" placeholder="搜索账号 / 平台 / 角色" oninput="filterAccounts()"><div id="rows"></div></section>`;filterAccounts()
}
function filterAccounts(){
 const el=document.getElementById('rows');if(!el)return;const q=(document.getElementById('q').value||'').toLowerCase();
 el.innerHTML=accounts().filter(a=>[a.name,a.platform,a.role,a.grade].join(' ').toLowerCase().includes(q)).map(a=>`<div class="row ${cls(a)}" onclick='openAccountById(${JSON.stringify(a.id)})'><div class="orb" style="width:34px;height:34px;margin:0">${a.grade}</div><div><b>${a.name}</b><div class="muted">${a.platform} · ${a.role}</div></div><div class="mini"><b>${fmt(a.play)}</b>${idx(a.performanceIndex)}</div></div>`).join('')
}
function renderDecision(app){
 app.innerHTML=`<section class="panel"><h2>矩阵决策雷达</h2><div class="muted">当前数据周期：${PACK.meta.sourcePeriod||'—'}。历史数据只作为底座，不等同于今天实时表现。</div><h3 style="font-size:12px;color:#e3c664">🔥 历史强势</h3>${topList().map(x=>`<div class="decision win"><b>${x.name} · ${x.platform}</b><small>${fmt(x.play)}播放 · 对自身基准 ${idx(x.ratio)} · 周环比 ${pct(x.wow)}</small></div>`).join('')}<h3 style="font-size:12px;color:#ff827a">⚠️ 历史观察</h3>${riskList().map(x=>`<div class="decision risk"><b>${x.name} · ${x.platform}</b><small>${fmt(x.play)}播放 · 对自身基准 ${idx(x.ratio)} · 周环比 ${pct(x.wow)}</small></div>`).join('')}</section>`
}
function renderData(app){
 app.innerHTML=`<section class="panel"><h2>私人数据管理</h2><div class="detail"><div>数据包周期：<b>${PACK.meta.sourcePeriod||'—'}</b></div><div>账号总数：<b>${accounts().length}</b></div><div>已匹配历史记录：<b>${PACK.meta.matchedRecords||0}</b></div><div>有播放数据：<b>${PACK.meta.withPlay||0}</b></div></div><div class="actions"><button class="primary" onclick="importPack()">导入新版数据包</button><button onclick="exportData()">导出备份</button><button class="danger" onclick="clearData()">清除本机数据</button></div><p class="muted" style="margin-top:14px">导入新版 JSON 会覆盖当前浏览器中的数据包。网页没有上传接口，也没有网络请求权限。</p></section>`
}
function tab(name,btn){currentTab=name;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');render()}
function openCamp(k){
 const c=PACK.D.camps[k];
 document.getElementById('drawerBody').innerHTML=`<h2>${c.name}</h2><p class="muted">${c.command||c.subtitle||''}</p>${c.accounts.map(a=>`<div class="row ${cls(a)}" onclick='openAccountById(${JSON.stringify(a.id)})'><div class="orb" style="width:34px;height:34px;margin:0">${a.grade}</div><div><b>${a.name}</b><div class="muted">${a.platform} · ${a.dataSignal||'暂无数据'}</div></div><div class="mini"><b>${fmt(a.play)}</b>${idx(a.performanceIndex)}</div></div>`).join('')}`;document.getElementById('drawer').classList.add('show')
}
function openAccountById(id){const a=accounts().find(x=>x.id===id);if(a)openAccount(a)}
function spark(a){const vals=(a.historyWeeks||[]).map(x=>Number(x.play)||0),mx=Math.max(...vals,1);return `<div class="spark">${vals.map(v=>`<i style="height:${v?Math.max(4,Math.round(v/mx*60)):3}px"></i>`).join('')}</div>`}
function openAccount(a){
 document.getElementById('drawerBody').innerHTML=`<div style="padding-top:20px"><div class="orb" style="width:52px;height:52px;margin:0">${a.grade}</div><h2>${a.name}</h2><div class="muted">${a.platform} · ${a.role}</div><div class="signal ${cls(a)}"><b>${a.dataSignal||'暂无匹配数据'}</b><br>${a.decision||'等待补充数据'}</div><div class="intel"><div class="cell"><small>最新周播放</small><b>${fmt(a.play)}</b></div><div class="cell"><small>净增粉丝</small><b>${fmt(a.netFollow)}</b></div><div class="cell"><small>粉丝数</small><b>${fmt(a.followers)}</b></div><div class="cell"><small>点赞 / 评论</small><b>${fmt(a.likes)} / ${fmt(a.comments)}</b></div><div class="cell"><small>4周基准</small><b>${fmt(a.baseline4w)}</b></div><div class="cell"><small>对自身基准</small><b>${idx(a.performanceIndex)}</b></div><div class="cell"><small>周环比</small><b>${pct(a.wow)}</b></div><div class="cell"><small>数据排名</small><b>${a.dataRank?'#'+a.dataRank:'—'}</b></div></div><div class="muted" style="margin-top:12px">近6周播放趋势</div>${spark(a)}<div class="detail"><div>账号定位：<b>${a.position||'—'}</b></div><div>当前模板：<b>${a.template||'—'}</b></div><div>更新频率：<b>${a.currentFreq||'—'}</b></div><div>健康状态：<b>${a.health||'—'}</b></div><div>异常/备注：<b>${a.currentStatus||'正常'}</b></div><div>负责人：<b>${a.currentOwner||a.owner||'—'}</b></div></div><p class="muted">数据周期：${a.dataPeriod||PACK.meta.sourcePeriod||'—'}</p></div>`;document.getElementById('drawer').classList.add('show')
}
function closeDrawer(){document.getElementById('drawer').classList.remove('show')}
load();render();
</script>
</body>
</html>
